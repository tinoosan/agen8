apiVersion: v1
kind: Namespace
metadata:
  name: agen8
---
apiVersion: v1
kind: Secret
metadata:
  name: agen8-secrets
  namespace: agen8
type: Opaque
stringData:
  AGEN8_SETUP_TOKEN: "replace-with-a-long-random-setup-token"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agen8-data
  namespace: agen8
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agen8
  namespace: agen8
  labels:
    app.kubernetes.io/name: agen8
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agen8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agen8
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: agen8
          image: ghcr.io/tinoosan/agen8:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7777
          env:
            - name: AGEN8_DATA_DIR
              value: /data
            - name: AGEN8_PUBLIC_URL
              value: https://agen8.example.com
            - name: AGEN8_DISABLE_LOCAL_HOOK_PROVISIONING
              value: "true"
            - name: AGEN8_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agen8-secrets
                  key: AGEN8_SETUP_TOKEN
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agen8-data
---
apiVersion: v1
kind: Service
metadata:
  name: agen8
  namespace: agen8
  labels:
    app.kubernetes.io/name: agen8
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agen8
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agen8
  namespace: agen8
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agen8.example.com
      secretName: agen8-tls
  rules:
    - host: agen8.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agen8
                port:
                  name: http

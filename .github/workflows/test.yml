name: Test

on:
  push:
  pull_request:

# CI mirrors the documented pre-push gate (see README "Pre-Push Check"):
# Go format/vet/staticcheck/revive/test/build and web lint/test/build. The
# checks are inlined here rather than calling helper scripts, because the
# scripts/ tree was removed in the project-first strip-down. staticcheck and
# revive are pinned to specific versions so the gate is reproducible.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: |
          drift="$(gofmt -l .)"
          if [ -n "$drift" ]; then
            echo "gofmt drift in:" >&2
            echo "$drift" >&2
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Install Go linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/mgechev/revive@v1.15.0

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run revive
        run: revive -config revive.toml -set_exit_status ./...

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Build agen8 binary
        run: go build -o bin/agen8 ./cmd/agen8

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run web lint
        run: npm run lint

      - name: Run web tests
        run: npm test

      - name: Build web app
        run: npm run build

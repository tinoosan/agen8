name: Test

on:
  push:
  pull_request:

# CI mirrors the documented pre-push gate (see README "Pre-Push Check"):
# Go format/vet/staticcheck/revive/test/build and web lint/test/build. The
# checks are inlined here rather than calling helper scripts, because the
# scripts/ tree was removed in the project-first strip-down. staticcheck and
# revive are pinned to specific versions so the gate is reproducible.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: |
          drift="$(gofmt -l .)"
          if [ -n "$drift" ]; then
            echo "gofmt drift in:" >&2
            echo "$drift" >&2
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Install Go linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/mgechev/revive@v1.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run revive
        run: revive -config revive.toml -set_exit_status ./...

      - name: Run Go tests
        run: go test ./... -count=1

      - name: Run Go race tests
        run: go test -race ./cmd/... ./internal/... ./pkg/... -count=1

      - name: Run security checks
        run: |
          govulncheck ./...
          gosec -quiet -exclude-generated ./...

      - name: Validate Kubernetes manifest
        run: |
          kubeconform -strict -summary deploy/kubernetes/agen8.yaml
          actionlint

      - name: Build agen8 binary
        run: go build -o bin/agen8 ./cmd/agen8

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Audit workspace tooling dependencies
        working-directory: .
        run: npm audit --package-lock-only --audit-level=low

      - name: Install web dependencies
        run: npm ci

      - name: Audit web dependencies
        run: npm audit --audit-level=low

      - name: Run web lint
        run: npm run lint -- --max-warnings 0

      - name: Run web tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Reject production source maps
        run: test -z "$(find ../internal/web/dist -type f -name '*.map' -print -quit)"

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build release container
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag agen8:ci \
            .

      - name: Verify runtime contract
        run: |
          test "$(docker image inspect agen8:ci --format '{{.Config.User}}')" = "agen8"
          size="$(docker image inspect agen8:ci --format '{{.Size}}')"
          echo "Uncompressed image size: ${size} bytes"
          test "$size" -lt 170000000
          docker run --rm --entrypoint git agen8:ci --version

          container_id="$(docker run --detach \
            --read-only \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            --tmpfs /tmp:uid=10001,gid=10001,mode=0700 \
            agen8:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

      - name: Scan release container
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            agen8:ci

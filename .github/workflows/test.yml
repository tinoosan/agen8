name: Test

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check Go formatting
        run: ./scripts/ci/check_gofmt.sh

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race tests
        run: ./scripts/ci/check_go_race.sh

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go staticcheck
        # Gating: staticcheck baseline is clean. Any new violation should
        # fail CI rather than accumulate.
        run: GO_LINT_TOOLS=staticcheck ./scripts/ci/check_go_lint.sh

      - name: Run revive (style/stutter)
        # Gating: the revive baseline is now clean against the active rule
        # set. Disabled rules (exported, unused-parameter, package-comments)
        # have rationales documented in revive.toml.
        run: GO_LINT_TOOLS=revive ./scripts/ci/check_go_lint.sh

      - name: Build agen8-mcp binary
        run: go build -o bin/agen8-mcp ./cmd/agen8-mcp

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run web lint
        run: npm run lint

      - name: Run web tests
        run: npm test

      - name: Build web app
        run: npm run build

  guardrails:
    runs-on: ubuntu-latest
    needs:
      - go
      - web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository guardrails
        run: ./scripts/ci/agent_guardrails.sh

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be semantic version syntax (for example v0.1.0 or v0.1.0-rc.1)" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install pinned Go checks
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/mgechev/revive@v1.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Verify Go source
        run: |
          drift="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$drift" || { printf 'gofmt drift:\n%s\n' "$drift" >&2; exit 1; }
          go vet ./...
          staticcheck ./...
          revive -config revive.toml -set_exit_status ./...
          go test ./... -count=1
          go test -race ./cmd/... ./internal/... ./pkg/... -count=1
          go build ./cmd/agen8

      - name: Verify Go security
        run: |
          govulncheck ./...
          gosec -quiet ./internal/daemon/... ./internal/hookinstaller/...
          kubeconform -strict -summary deploy/kubernetes/agen8.yaml
          actionlint

      - name: Install and audit web dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=low

      - name: Audit workspace tooling dependencies
        run: npm audit --package-lock-only --audit-level=low

      - name: Verify web app
        working-directory: web
        run: |
          npm run lint -- --max-warnings 0
          npm test -- --run
          npm run build
          test -z "$(find ../internal/web/dist -type f -name '*.map' -print -quit)"

  archives:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          archive="agen8_${VERSION#v}_${GOOS}_${GOARCH}.tar.gz"
          binary_dir="dist/agen8_${GOOS}_${GOARCH}"
          mkdir -p "${binary_dir}"
          go build -ldflags "-X github.com/tinoosan/agen8/pkg/buildinfo.Version=${VERSION} -X github.com/tinoosan/agen8/pkg/buildinfo.Commit=${COMMIT} -X github.com/tinoosan/agen8/pkg/buildinfo.BuildDate=${BUILD_DATE}" -o "${binary_dir}/agen8" ./cmd/agen8
          tar -C "${binary_dir}" -czf "dist/${archive}" agen8
          shasum -a 256 "dist/${archive}" > "dist/${archive}.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish-release:
    needs: archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set build date
        id: build-date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
